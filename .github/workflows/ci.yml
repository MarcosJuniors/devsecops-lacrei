name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Executa testes
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define tag da imagem
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build da imagem
        run: docker build -t marcos98mj/devsecops-lacrei:${IMAGE_TAG} .

      - name: Publica imagem
        run: docker push marcos98mj/devsecops-lacrei:${IMAGE_TAG}

      - name: Deploy no Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=docker.io/marcos98mj/devsecops-lacrei:${IMAGE_TAG}"